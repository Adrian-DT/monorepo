<div class="yko-dialog-backdrop" role="presentation">
  <section
    class="yko-vacation-approval-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="vacation-approval-title"
  >
    <header class="yko-vacation-approval-dialog__header">
      <h2 id="vacation-approval-title">Revisar solicitud de vacaciones</h2>
    </header>

    <div class="yko-vacation-approval-dialog__content">
      <p>
        <strong>Empleado:</strong>
        {{ request().userName }}
      </p>

      <p>
        <strong>Periodo:</strong>
        {{ request().startDate }} — {{ request().endDate }}
      </p>

      <p>
        <strong>Días laborables:</strong>
        {{ request().workingDays }}
      </p>

      <p>
        <strong>Motivo:</strong>
        {{ request().reason }}
      </p>

      <label for="adminComment"> Comentario para el empleado </label>

      <textarea
        id="adminComment"
        name="adminComment"
        rows="4"
        [(ngModel)]="adminComment"
        placeholder="Comentario opcional"
      >
      </textarea>
    </div>

    <footer class="yko-vacation-approval-dialog__actions">
      <button type="button" class="yko-button yko-button--secondary" (click)="cancelled.emit()">
        Cancelar
      </button>

      <button type="button" class="yko-button yko-button--reject" (click)="reject()">
        Rechazar
      </button>

      <button type="button" class="yko-button yko-button--approve" (click)="approve()">
        Aprobar
      </button>
    </footer>
  </section>
</div>
