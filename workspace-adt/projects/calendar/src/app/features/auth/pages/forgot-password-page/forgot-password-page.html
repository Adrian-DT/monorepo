<section class="yko-login-page">
  <form class="yko-login-form" (ngSubmit)="submit()">
    <h1>Recuperar contraseña</h1>

    @if (sent()) {
      <p>
        Si la cuenta existe, recibirás un correo con las instrucciones para restablecer tu
        contraseña.
      </p>
    } @else {
      <div class="yko-form-field">
        <label for="identifier">Usuario o correo electrónico</label>

        <input
          id="identifier"
          name="identifier"
          type="text"
          [(ngModel)]="identifier"
          required
          autocomplete="username"
        />
      </div>

      @if (errorMessage()) {
        <p class="yko-error-message">
          {{ errorMessage() }}
        </p>
      }

      <button class="yko-login-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar instrucciones' }}
      </button>
    }

    <a routerLink="/login">Volver a iniciar sesión</a>
  </form>
</section>
