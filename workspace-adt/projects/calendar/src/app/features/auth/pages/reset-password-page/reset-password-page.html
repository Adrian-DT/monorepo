<section class="yko-login-page">
  <form class="yko-login-form" (ngSubmit)="submit()">
    <h1>Definir contraseña</h1>

    @if (!hasToken) {
      <p class="yko-error-message">El enlace no es válido.</p>

      <a routerLink="/forgot-password">Solicitar un enlace nuevo</a>
    } @else if (done()) {
      <p>Tu contraseña se ha actualizado correctamente.</p>

      <a routerLink="/login">Iniciar sesión</a>
    } @else {
      <div class="yko-form-field">
        <label for="newPassword">Nueva contraseña</label>

        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      <div class="yko-form-field">
        <label for="confirmPassword">Repite la contraseña</label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        />
      </div>

      @if (errorMessage()) {
        <p class="yko-error-message">
          {{ errorMessage() }}
        </p>
      }

      <button class="yko-login-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    }
  </form>
</section>
