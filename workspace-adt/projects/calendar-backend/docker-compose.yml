services:
  postgres:
    image: postgres:16
    container_name: yko-calendar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar_dev
    ports:
      - '5432:5432'
    volumes:
      - calendar_postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: yko-calendar-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  calendar_postgres_data:
