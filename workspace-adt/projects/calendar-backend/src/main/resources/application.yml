spring:
  application:
    name: calendar-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/calendar
    username: calendar
    password: calendar_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
