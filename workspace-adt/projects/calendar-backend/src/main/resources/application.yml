spring:
  application:
    name: calendar-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/calendar
    username: calendar
    password: calendar_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    reset-token-expiration-minutes: 30
    invitation-token-expiration-minutes: 4320
  mail:
    from: ${MAIL_FROM:no-reply@yko-calendar.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@yko-calendar.local}
    password: ${ADMIN_PASSWORD:admin1234}
    display-name: Administrador

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
